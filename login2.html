<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  <style>
    * {
      margin: 0%;
      box-sizing: border-box;
    }

    #centro {
      display: flex;

    }

    #one,
    #two,
    #tres {
      height: 400px;
      width: 400px;
      background: linear-gradient(white 1%, rgb(0, 47, 255));
      flex-direction: column;
      border: 2px solid;
      margin: 30px;
    }

    body {
      background: linear-gradient(rgb(0, 110, 255));
    }
  </style>
</head>

<body style="background-color: blue;">
  <div id="centro">
    <div id="one">
      <img src="seta.png" alt="" height="70" width="400px">
      <input type="text" placeholder="user name"
        style="margin-top: 50px; margin-left: 10px;  border-top-left-radius: 50px; border-bottom-left-radius: 50px; border-top-right-radius: 50px; border-bottom-right-radius: 50px; display: inline;">
      <input type="password" name="" id="" placeholder="password"
        style="margin-top: 10px; margin-left: 10px;  border-top-left-radius: 50px; border-bottom-left-radius: 50px; border-top-right-radius: 50px; border-bottom-right-radius: 50px; display: inline;">
      <input type="checkbox" name="" id="" style="margin-left: 10px;">remember passowrd
      <button
        style="display: flex; background-color: blue; width: 50px; border-top-left-radius: 50px; border-bottom-left-radius: 50px; border-top-right-radius: 50px; border-bottom-right-radius: 50px; color: white; padding: 10px; margin: 10px; display: inline;">sign
        in</button>
      <a href="" style="color: white;">forgot password?</a>
      <p style="margin-left: 10px;">sign in with social media</p>
      <img src="facebook.png" alt="" height="50" style="margin-left: 10px;"> <img src="twiter.png" alt="" height="50">
      <img src="linked.png" alt="" height="50">
      <p>dont have an account?</p>
      <p style="font-size: 20px; color: white; display: inline;">sign up</p><img src="setadire.png" alt=""
        height="30px">
    </div>
    <div id="two">
      <img src="seta.png" alt="" height="70" width="400px">
      <h1 style="margin-left: 50px; color: rgb(255, 0, 0);">crack <p>of</p> dawn</h1>
      <h2 style="color: rgb(179, 50, 50);">like the first light</h2>
      <p
        style="margin-top: 50px;  border-top-left-radius: 50px; border-bottom-left-radius: 50px; border-top-right-radius: 50px; border-bottom-right-radius: 50px; background-color: white; display: flex; width: 150px; margin-left: 50px; padding: 10px;">
        sign in</p>
      <p
        style="margin-top: 50px;  border-top-left-radius: 50px; border-bottom-left-radius: 50px; border-top-right-radius: 50px; border-bottom-right-radius: 50px; background-color: white; display: flex; width: 150px; margin-left: 50px; padding: 10px;">
        sign up</p>
    </div>
    <div id="tres">
      <img src="seta.png" alt="" height="70" width="400px">
      <input type="text" placeholder="user name"
        style="margin-top: 50px; margin-left: 10px;  border-top-left-radius: 50px; border-bottom-left-radius: 50px; border-top-right-radius: 50px; border-bottom-right-radius: 50px; display: inline;">
        <input type="text" placeholder="email"
        style="margin-top: 25px; margin-left: 10px;  border-top-left-radius: 50px; border-bottom-left-radius: 50px; border-top-right-radius: 50px; border-bottom-right-radius: 50px; display: inline; display: block;">
        <input type="password" placeholder="password"
        style="margin-top: 25px; margin-left: 10px;  border-top-left-radius: 50px; border-bottom-left-radius: 50px; border-top-right-radius: 50px; border-bottom-right-radius: 50px; display: inline;">
        <input type="checkbox" name="" id="" style="margin-left: 5px; display: inline">allow terms and conditions
        <button
        style="display: flex; background-color: blue; width: 50px; border-top-left-radius: 50px; border-bottom-left-radius: 50px; border-top-right-radius: 50px; border-bottom-right-radius: 50px; color: white; margin: 10px; display: inline; padding-left: 10px; width: 100px; margin-left: 100px;">sign
        in</button>
    </div>

  </div>
</body>

</html>
